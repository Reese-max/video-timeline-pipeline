name: Cost tracker local tests

on:
  pull_request:
    paths:
      - cost_tracker.py
      - notifications.py
      - requirements.txt
      - tests/test_cost_tracker.py
      - .github/workflows/cost-tracker-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-cost-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local cost tracker tests
        run: python -m unittest discover -s tests -p "test_cost_tracker.py" -v
