name: Video Timeline CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixed retrieval replay loads its admitted baseline by commit SHA.
          # A shallow merge checkout omits that object on both hosted OS images.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install Python dependencies
        run: |
          python -X utf8 -m pip install -r requirements.txt
          python -X utf8 -m pip install -r requirements-web.txt
      - name: Verify Windows synchronization fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/test_windows_sync.ps1
      - name: Check Linux GitOps shell syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/start-mcp-supervised.sh
          bash -n scripts/sync-linux.sh
          bash -n scripts/bootstrap-gitops.sh
      - name: Run full offline Python, MCP and widget regressions
        run: python -X utf8 -B scripts/check_offline.py
